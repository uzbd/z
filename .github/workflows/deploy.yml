name: Build and deploy Smart Text Decoder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download dictionaries
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt -o public/words.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english.txt -o public/common-words.txt
          test -s public/words.txt && test -s public/common-words.txt
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
